        <rect x="32" y="153.0" width="48" height="48" fill="#1e3a8a"/>
        <rect x="128" y="153.0" width="48" height="48" fill="#1e3a8a"/>
        <rect x="224" y="153.0" width="48" height="48" fill="#1e3a8a"/>
        
        <rect x="32" y="192" width="48" height="48" fill="#1e3a8a"/>
        <rect x="128" y="192" width="48" height="48" fill="#1e3a8a"/>
        <rect x="224" y="192" width="48" height="48" fill="#1e3a8a"/>
        
