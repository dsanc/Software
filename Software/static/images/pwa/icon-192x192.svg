        <rect x="64" y="76.0" width="24" height="24" fill="#1e3a8a"/>
        <rect x="112" y="76.0" width="24" height="24" fill="#1e3a8a"/>
        
        <rect x="16" y="96" width="24" height="24" fill="#1e3a8a"/>
        <rect x="64" y="96" width="24" height="24" fill="#1e3a8a"/>
        <rect x="112" y="96" width="24" height="24" fill="#1e3a8a"/>
        
