        <rect x="48" y="57.0" width="18" height="18" fill="#1e3a8a"/>
        <rect x="84" y="57.0" width="18" height="18" fill="#1e3a8a"/>
        
        <rect x="12" y="72" width="18" height="18" fill="#1e3a8a"/>
