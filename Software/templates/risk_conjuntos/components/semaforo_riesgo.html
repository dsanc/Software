{% load static %}

<div class="semaforo-riesgo semaforo-{{ tamaño }} {{ clase_semaforo }}" title="{{ descripcion }}">
    <div class="semaforo-indicador">
        <div class="semaforo-circulo" style="background-color: {{ color }};">
            {% if mostrar_porcentaje %}
                <span class="semaforo-porcentaje">{{ porcentaje|floatformat:1 }}%</span>
            {% endif %}
        </div>
    </div>
    
    {% if mostrar_texto %}
        <div class="semaforo-texto">
            <span class="semaforo-label">{{ texto }}</span>
        </div>
    {% endif %}
</div>

<style>
.semaforo-riesgo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.semaforo-indicador {
    position: relative;
}

.semaforo-circulo {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}

/* Tamaños */
.semaforo-normal .semaforo-circulo {
    width: 40px;
    height: 40px;
    font-size: 11px;
}

.semaforo-pequeño .semaforo-circulo {
    width: 30px;
    height: 30px;
    font-size: 9px;
}

.semaforo-grande .semaforo-circulo {
    width: 60px;
    height: 60px;
    font-size: 14px;
}

.semaforo-texto {
    font-size: 14px;
    font-weight: 500;
}

/* Estados del semáforo */
.semaforo-bajo .semaforo-texto {
    color: #28a745;
}

.semaforo-medio .semaforo-texto {
    color: #ffc107;
}

.semaforo-alto .semaforo-texto {
    color: #dc3545;
}

.semaforo-sin-evaluar .semaforo-texto {
    color: #6c757d;
}

/* Hover effects */
.semaforo-riesgo:hover .semaforo-circulo {
    transform: scale(1.1);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* Responsive */
@media (max-width: 768px) {
    .semaforo-riesgo {
        flex-direction: column;
        text-align: center;
        gap: 4px;
    }
    
    .semaforo-texto {
        font-size: 12px;
    }
}
</style>
