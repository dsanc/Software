<!-- Métricas Detalladas Card Component -->
<div class="metric-card">
    <div class="d-flex align-items-center">
        <div class="metric-icon bg-{{ color }}-subtle text-{{ color }}">
            <i class="fas fa-{{ icon }}"></i>
        </div>
        <div class="flex-grow-1 ms-3">
            <div class="metric-value" data-target="{{ value }}">0</div>
            <div class="metric-label">{{ title }}</div>
            {% if description %}
                <div class="metric-description text-muted">{{ description }}</div>
            {% endif %}
            {% if trend %}
                <div class="metric-change {{ trend.class }}">
                    <i class="fas fa-arrow-{% if trend.class == 'positive' %}up{% elif trend.class == 'negative' %}down{% else %}right{% endif %}"></i>
                    {{ trend.value }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
