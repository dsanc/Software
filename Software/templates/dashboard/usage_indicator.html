<div class="usage-indicator mb-2">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <small class="text-muted fw-semibold">{{ label }}:</small>
        <small class="text-{{ status_color }} fw-semibold">
            {% if is_unlimited %}
                {{ used }} ({{ status_text }})
            {% else %}
                {{ used }}/{{ limit }} ({{ percentage|floatformat:0 }}%)
            {% endif %}
        </small>
    </div>
    {% if not is_unlimited %}
    <div class="progress" style="height: 6px;">
        <div class="progress-bar bg-{{ status_color }}" 
             role="progressbar" 
             style="width: {{ percentage }}%"
             aria-valuenow="{{ percentage }}" 
             aria-valuemin="0" 
             aria-valuemax="100">
        </div>
    </div>
    {% else %}
    <div class="unlimited-indicator">
        <i class="fas fa-infinity text-{{ status_color }} me-1"></i>
        <small class="text-{{ status_color }}">{{ status_text }}</small>
    </div>
    {% endif %}
</div>
